<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 서비스 허브</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #3730a3 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
        }

        .sidebar {
            width: 240px;
            background: linear-gradient(180deg, rgba(30, 27, 75, 0.95) 0%, rgba(49, 46, 129, 0.95) 100%);
            border-right: 1px solid rgba(168, 85, 247, 0.3);
            padding: 24px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            padding: 0 24px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
        }

        .sidebar-menu li {
            margin: 0;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 15px;
            font-weight: 500;
            border-left: 3px solid transparent;
        }

        .sidebar-menu a:hover {
            color: #fff;
            background: rgba(168, 85, 247, 0.2);
            border-left-color: #a855f7;
        }

        .sidebar-menu a.active {
            color: #d8b4fe;
            background: rgba(168, 85, 247, 0.3);
            border-left-color: #a855f7;
            font-weight: 600;
        }

        .sidebar-menu .icon {
            font-size: 18px;
            min-width: 24px;
        }

        .main-content {
            margin-left: 240px;
            flex: 1;
            width: calc(100% - 240px);
        }

        .service-card {
            background: linear-gradient(135deg, rgba(67, 56, 202, 0.4) 0%, rgba(99, 102, 241, 0.2) 100%);
            border: 1px solid rgba(224, 242, 254, 0.2);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.1) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .service-card:hover {
            transform: translateY(-8px);
            border-color: rgba(168, 85, 247, 0.4);
            background: linear-gradient(135deg, rgba(67, 56, 202, 0.6) 0%, rgba(99, 102, 241, 0.4) 100%);
        }

        .service-card:hover::before {
            opacity: 1;
        }

        .service-icon {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 16px;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .service-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .service-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .visit-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }

        .visit-btn:hover {
            transform: translateX(4px);
            box-shadow: 0 8px 16px rgba(168, 85, 247, 0.3);
        }

        .category-title {
            font-size: 24px;
            font-weight: 700;
            margin-top: 48px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
        }

        .category-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 28px;
            background: linear-gradient(180deg, #a855f7 0%, #ec4899 100%);
            border-radius: 2px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .header {
            padding: 40px 20px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(224, 242, 254, 0.1);
            background: linear-gradient(180deg, rgba(168, 85, 247, 0.1) 0%, transparent 100%);
        }

        .header-title {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header-wrapper {
            padding: 40px 20px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(224, 242, 254, 0.1);
            background: linear-gradient(180deg, rgba(168, 85, 247, 0.1) 0%, transparent 100%);
        }

        .toggle-sidebar {
            display: none;
            position: fixed;
            bottom: 40px;
            left: 40px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4);
            z-index: 999;
        }

        .add-service-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-service-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 32px rgba(168, 85, 247, 0.5);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border: 1px solid rgba(224, 242, 254, 0.2);
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            color: white;
        }

        .modal-content h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(224, 242, 254, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 14px;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .form-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            color: white;
        }

        .btn-submit:hover {
            box-shadow: 0 8px 16px rgba(168, 85, 247, 0.3);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(168, 85, 247, 0.3);
            color: #d8b4fe;
        }

        @media (max-width: 768px) {
            .header-title {
                font-size: 28px;
            }

            .category-title {
                font-size: 20px;
            }

            .add-service-btn {
                bottom: 80px;
                right: 20px;
                width: 48px;
                height: 48px;
                font-size: 24px;
            }

            .category-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }

            .sidebar {
                width: 240px;
                transform: translateX(-240px);
                transition: transform 0.3s ease;
                z-index: 1000;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                width: 100%;
            }

            .toggle-sidebar {
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-title">카테고리</div>
        <ul class="sidebar-menu">
            <li>
                <a href="#generativeAI" class="nav-link active" data-category="generativeAI">
                    <span class="icon">✨</span>
                    <span>생성형 AI</span>
                </a>
            </li>
            <li>
                <a href="#infoCollection" class="nav-link" data-category="infoCollection">
                    <span class="icon">📰</span>
                    <span>정보수집</span>
                </a>
            </li>
            <li>
                <a href="#usefulSites" class="nav-link" data-category="usefulSites">
                    <span class="icon">🛠️</span>
                    <span>유용한 사이트</span>
                </a>
            </li>
            <li>
                <a href="#courseMaterials" class="nav-link" data-category="courseMaterials">
                    <span class="icon">📚</span>
                    <span>강의 자료</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <div class="header">
            <h1 class="header-title">AI 서비스 허브</h1>
            <p class="header-subtitle">자주 가는 사이트를 한 곳에서 관리하세요</p>
        </div>

        <!-- Main Container -->
        <div class="container">
        <!-- 생성형 AI -->
        <h2 class="category-title">✨ 생성형 AI</h2>
        <div class="category-grid" id="generativeAI">
            <!-- 서비스가 동적으로 추가됨 -->
        </div>

        <!-- 정보수집 -->
        <h2 class="category-title">📰 정보수집</h2>
        <div class="category-grid" id="infoCollection">
            <!-- 서비스가 동적으로 추가됨 -->
        </div>

        <!-- 유용한 사이트 -->
        <h2 class="category-title">🛠️ 유용한 사이트</h2>
        <div class="category-grid" id="usefulSites">
            <!-- 서비스가 동적으로 추가됨 -->
        </div>

        <!-- 강의 자료 -->
        <h2 class="category-title">📚 강의 자료</h2>
        <div class="category-grid" id="courseMaterials">
            <!-- 서비스가 동적으로 추가됨 -->
        </div>
    </div>

        <!-- Add Service Button -->
        <button class="add-service-btn" onclick="openModal()">+</button>
    </div>

    <!-- Toggle Sidebar Button (Mobile) -->
    <button class="toggle-sidebar" id="toggleSidebar" onclick="toggleSidebar()">☰</button>

    <!-- Modal -->
    <div class="modal" id="serviceModal">
        <div class="modal-content">
            <h3>새 서비스 추가</h3>
            <div class="form-group">
                <label>서비스 이름</label>
                <input type="text" id="serviceName" placeholder="예: ChatGPT">
            </div>
            <div class="form-group">
                <label>설명</label>
                <textarea id="serviceDesc" placeholder="서비스에 대한 간단한 설명을 입력하세요"></textarea>
            </div>
            <div class="form-group">
                <label>카테고리</label>
                <select id="serviceCategory">
                    <option value="generativeAI">생성형 AI</option>
                    <option value="infoCollection">정보수집</option>
                    <option value="usefulSites">유용한 사이트</option>
                    <option value="courseMaterials">강의 자료</option>
                </select>
            </div>
            <div class="form-group">
                <label>웹사이트 URL</label>
                <input type="url" id="serviceUrl" placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label>이모지 (아이콘)</label>
                <input type="text" id="serviceEmoji" placeholder="🤖" maxlength="2">
            </div>
            <div class="form-actions">
                <button class="btn-submit" onclick="addService()">추가하기</button>
                <button class="btn-cancel" onclick="closeModal()">취소</button>
            </div>
        </div>
    </div>

    <script>
        // 기본 서비스 데이터
        const defaultServices = {
            generativeAI: [
                {
                    name: 'Claude',
                    desc: 'Anthropic의 인공지능 어시스턴트',
                    url: 'https://claude.ai',
                    emoji: '🤖'
                },
                {
                    name: 'ChatGPT',
                    desc: 'OpenAI의 GPT-4 기반 AI 챗봇',
                    url: 'https://chat.openai.com',
                    emoji: '💬'
                },
                {
                    name: 'Gemini',
                    desc: 'Google의 멀티모달 AI 모델',
                    url: 'https://gemini.google.com',
                    emoji: '🌟'
                },
                {
                    name: 'Perplexity',
                    desc: '검색 기능이 강화된 AI 어시스턴트',
                    url: 'https://perplexity.ai',
                    emoji: '🔮'
                }
            ],
            infoCollection: [
                {
                    name: 'Google News',
                    desc: '세계 뉴스를 한곳에서',
                    url: 'https://news.google.com',
                    emoji: '📰'
                },
                {
                    name: 'Reddit',
                    desc: '다양한 커뮤니티와 토론',
                    url: 'https://reddit.com',
                    emoji: '🧵'
                },
                {
                    name: 'Hacker News',
                    desc: '기술 및 IT 뉴스',
                    url: 'https://news.ycombinator.com',
                    emoji: '⚙️'
                }
            ],
            usefulSites: [
                {
                    name: 'GitHub',
                    desc: '코드 저장소 및 협업 플랫폼',
                    url: 'https://github.com',
                    emoji: '🐙'
                },
                {
                    name: 'Stack Overflow',
                    desc: '프로그래밍 Q&A',
                    url: 'https://stackoverflow.com',
                    emoji: '❓'
                },
                {
                    name: 'Notion',
                    desc: '올인원 작업 공간',
                    url: 'https://notion.so',
                    emoji: '📝'
                }
            ],
            courseMaterials: [
                {
                    name: 'Coursera',
                    desc: '온라인 대학 수강',
                    url: 'https://coursera.org',
                    emoji: '🎓'
                },
                {
                    name: 'Udemy',
                    desc: '다양한 주제의 온라인 강좌',
                    url: 'https://udemy.com',
                    emoji: '👨‍🏫'
                },
                {
                    name: 'YouTube',
                    desc: '학습 자료 영상',
                    url: 'https://youtube.com',
                    emoji: '📺'
                }
            ]
        };

        // 로컬스토리지에서 서비스 불러오기
        function loadServices() {
            const saved = localStorage.getItem('aiHubServices');
            return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultServices));
        }

        // 로컬스토리지에 서비스 저장
        function saveServices(services) {
            localStorage.setItem('aiHubServices', JSON.stringify(services));
        }

        // 서비스 카드 렌더링
        function renderServices() {
            const services = loadServices();

            Object.keys(services).forEach(category => {
                const container = document.getElementById(category);
                container.innerHTML = '';

                services[category].forEach((service, index) => {
                    const card = document.createElement('div');
                    card.className = 'service-card';
                    card.innerHTML = `
                        <div class="service-icon">${service.emoji}</div>
                        <div class="service-title">${service.name}</div>
                        <div class="service-desc">${service.desc}</div>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <a href="${service.url}" target="_blank" class="visit-btn">
                                방문하기 →
                            </a>
                            <button onclick="deleteService('${category}', ${index})" style="background: rgba(239, 68, 68, 0.3); border: 1px solid rgba(239, 68, 68, 0.5); color: #fca5a5; padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 600; transition: all 0.3s ease;" onmouseover="this.style.background='rgba(239, 68, 68, 0.5)'" onmouseout="this.style.background='rgba(239, 68, 68, 0.3)'">
                                삭제
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        // Modal 열기
        function openModal() {
            document.getElementById('serviceModal').classList.add('active');
        }

        // Modal 닫기
        function closeModal() {
            document.getElementById('serviceModal').classList.remove('active');
            document.getElementById('serviceName').value = '';
            document.getElementById('serviceDesc').value = '';
            document.getElementById('serviceUrl').value = '';
            document.getElementById('serviceEmoji').value = '';
            document.getElementById('serviceCategory').value = 'generativeAI';
        }

        // 서비스 추가
        function addService() {
            const name = document.getElementById('serviceName').value.trim();
            const desc = document.getElementById('serviceDesc').value.trim();
            const url = document.getElementById('serviceUrl').value.trim();
            const emoji = document.getElementById('serviceEmoji').value.trim();
            const category = document.getElementById('serviceCategory').value;

            if (!name || !desc || !url || !emoji) {
                alert('모든 필드를 입력해주세요.');
                return;
            }

            const services = loadServices();
            services[category].push({ name, desc, url, emoji });
            saveServices(services);
            renderServices();
            closeModal();
        }

        // 서비스 삭제
        function deleteService(category, index) {
            if (confirm('정말로 삭제하시겠습니까?')) {
                const services = loadServices();
                services[category].splice(index, 1);
                saveServices(services);
                renderServices();
            }
        }

        // 초기 렌더링
        renderServices();

        // Modal 외부 클릭 시 닫기
        document.getElementById('serviceModal').addEventListener('click', (e) => {
            if (e.target.id === 'serviceModal') {
                closeModal();
            }
        });

        // 사이드바 토글
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        // 사이드바 메뉴 클릭 처리
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();

                // 활성 링크 업데이트
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');

                // 해당 섹션으로 스크롤
                const category = link.getAttribute('data-category');
                const element = document.getElementById(category);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }

                // 모바일에서 사이드바 닫기
                if (window.innerWidth <= 768) {
                    toggleSidebar();
                }
            });
        });

        // 스크롤 이벤트로 사이드바 메뉴 동기화
        window.addEventListener('scroll', () => {
            const sections = ['generativeAI', 'infoCollection', 'usefulSites', 'courseMaterials'];

            sections.forEach(sectionId => {
                const element = document.getElementById(sectionId);
                if (element) {
                    const rect = element.getBoundingClientRect();
                    if (rect.top < 200 && rect.top > -rect.height) {
                        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
                        document.querySelector(`[data-category="${sectionId}"]`).classList.add('active');
                    }
                }
            });
        });
    </script>
</body>
</html>
