<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>Mindstream LAB 마크</title>
<link rel="stylesheet" href="brand.css">
<style>
 body{margin:0;background:#E8E8E8;font-family:system-ui,sans-serif;}
 .box{padding:44px 56px;}
 .light{background:#FFFFFF;}
 .dark{background:#101B2D;}
 .row{display:flex;gap:0;flex-direction:column;}
 .cap{font-size:11px;letter-spacing:.1em;color:#888;padding:10px 56px 0;text-transform:uppercase;}
</style></head>
<body>
<div class="cap">Stacked / Light</div>
<div class="box light">
  <div class="ms-mark" style="--ms-size:56px;">
    <div class="ms-top">
      <div class="ms-brand"><span class="ms-word">Mindstream</span><span class="ms-rule"></span></div>
      <span class="ms-lab">LAB</span>
    </div>
    <div class="ms-sub">AWESOME JWY</div>
  </div>
</div>

<div class="cap">Stacked / Dark</div>
<div class="box dark">
  <div class="ms-mark ms-on-dark" style="--ms-size:56px;">
    <div class="ms-top">
      <div class="ms-brand"><span class="ms-word">Mindstream</span><span class="ms-rule"></span></div>
      <span class="ms-lab">LAB</span>
    </div>
    <div class="ms-sub">AWESOME JWY</div>
  </div>
</div>

<div class="cap">Inline / Light</div>
<div class="box light">
  <span class="ms-mark ms-inline" style="--ms-size:28px;color:#16233C;">
    <span class="ms-word">Mindstream</span><span class="ms-lab">LAB</span><span class="ms-divider"></span><span class="ms-sub">Awesome JWY</span>
  </span>
</div>

<div class="cap">Inline / Dark</div>
<div class="box dark">
  <span class="ms-mark ms-inline ms-on-dark" style="--ms-size:28px;color:#F2F6FA;">
    <span class="ms-word">Mindstream</span><span class="ms-lab">LAB</span><span class="ms-divider"></span><span class="ms-sub">Awesome JWY</span>
  </span>
</div>
</body></html>
