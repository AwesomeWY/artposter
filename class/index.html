<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 허브 · Class Hub</title>
<style>
  :root{
    --bg:#f6f7f9;
    --surface:#ffffff;
    --line:#e4e7ec;
    --ink:#16191f;
    --ink-2:#5b626e;
    --ink-3:#8d94a1;
    --brand:#2f5cff;
    --c1:#2f5cff;   /* 수업 자료 */
    --c2:#8b3ff5;   /* AI 도구 */
    --c3:#0f9d76;   /* 참고 자료 */
    --accent:var(--c1);
    --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

  /* ---------- 상단: 상위 메뉴 ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(255,255,255,.92);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .bar{display:flex;align-items:center;gap:28px;height:62px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.02em;flex:none}
  .logo .mark{
    width:26px;height:26px;border-radius:8px;flex:none;
    background:linear-gradient(135deg,var(--c1) 0%,var(--c2) 55%,var(--c3) 100%);
  }
  nav.top{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  nav.top::-webkit-scrollbar{display:none}
  nav.top button{
    appearance:none;border:0;background:transparent;cursor:pointer;
    font:inherit;font-weight:600;font-size:15px;color:var(--ink-2);
    padding:8px 14px;border-radius:9px;white-space:nowrap;
    transition:background .15s,color .15s;
  }
  nav.top button:hover{background:#eef1f6;color:var(--ink)}
  nav.top button[aria-selected="true"]{background:var(--accent);color:#fff}

  /* ---------- 하단: 2단계 메뉴 ---------- */
  .subbar{border-bottom:1px solid var(--line);background:var(--surface)}
  nav.sub{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
  nav.sub::-webkit-scrollbar{display:none}
  nav.sub a{
    padding:13px 2px;font-size:14px;font-weight:600;color:var(--ink-3);
    border-bottom:2px solid transparent;white-space:nowrap;
    transition:color .15s,border-color .15s;
  }
  nav.sub a:hover{color:var(--ink)}
  nav.sub a.active{color:var(--accent);border-bottom-color:var(--accent)}

  /* ---------- 본문 ---------- */
  main{padding:36px 0 72px}
  .page-head{margin:0 0 30px}
  .page-head h1{margin:0;font-size:27px;letter-spacing:-.03em;font-weight:800}
  .page-head p{margin:7px 0 0;color:var(--ink-2);font-size:14.5px}

  section.group{scroll-margin-top:128px;margin-bottom:40px}
  .group-head{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
  .group-head h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
  .group-head .count{font-size:12.5px;color:var(--ink-3);font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
  .card{
    display:flex;gap:13px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);
    transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
    box-shadow:0 2px 4px rgba(16,24,40,.05),0 14px 30px rgba(16,24,40,.10);
  }
  .card .ico{
    width:40px;height:40px;border-radius:11px;flex:none;
    display:grid;place-items:center;font-size:19px;
    background:color-mix(in srgb,var(--accent) 11%,#fff);
  }
  .card .body{display:block;min-width:0;flex:1 1 auto}
  .card .name{font-weight:700;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
  .card .name .ext{color:var(--ink-3);font-size:12px;transition:transform .16s,color .16s}
  .card:hover .name .ext{color:var(--accent);transform:translate(2px,-2px)}
  .card .desc{display:block;margin-top:3px;color:var(--ink-2);font-size:13px}
  .card .host{
    display:block;margin-top:8px;font-size:11.5px;color:var(--ink-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  footer{border-top:1px solid var(--line);padding:22px 0;color:var(--ink-3);font-size:13px;background:var(--surface)}

  @media (max-width:640px){
    .bar{height:auto;flex-direction:column;align-items:stretch;gap:0;padding:12px 0 0}
    .logo{padding-bottom:10px}
    nav.top{padding-bottom:10px}
    main{padding:26px 0 56px}
    .page-head h1{font-size:23px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="#"><span class="mark"></span>수업 허브</a>
      <nav class="top" id="topNav" role="tablist"></nav>
    </div>
  </div>
  <div class="subbar">
    <div class="wrap"><nav class="sub" id="subNav"></nav></div>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <h1 id="pageTitle"></h1>
    <p id="pageDesc"></p>
  </div>
  <div id="content"></div>
</main>

<footer><div class="wrap">수업에서 자주 쓰는 사이트 모음 · 링크는 새 탭에서 열립니다.</div></footer>

<script>
const DATA = [
  {
    id: "class",
    label: "수업 자료",
    color: "var(--c1)",
    desc: "수업에서 바로 여는 교안·갤러리·도구 모음입니다.",
    groups: [
      {
        id: "material", label: "학습 자료", icon: "📚",
        items: [
          { name: "수업용 교안", desc: "차시별 수업 노트와 실습 안내", url: "https://note26.colabstart.workers.dev/", icon: "📝" },
          { name: "학생작품 갤러리", desc: "학생들이 만든 프로젝트 모음", url: "https://class-project-gallery-2606.vercel.app/", icon: "🎨" }
        ]
      },
      {
        id: "tool", label: "수업용 도구", icon: "🛠️",
        items: [
          { name: "URL 줄이기", desc: "긴 주소를 짧은 링크로 변환", url: "https://biz-link.click/", icon: "🔗" },
          { name: "코드붐", desc: "코딩 실습·문제 풀이 도구", url: "https://frontierall.github.io/CodeBom-2608/", icon: "💥" }
        ]
      }
    ]
  },
  {
    id: "ai",
    label: "AI 도구",
    color: "var(--c2)",
    desc: "수업에 활용하는 생성형 AI 서비스입니다.",
    groups: [
      {
        id: "chat", label: "텍스트 · 채팅", icon: "💬",
        items: [
          { name: "ChatGPT", desc: "OpenAI 대화형 AI", url: "https://chatgpt.com/", icon: "🟢" },
          { name: "Claude", desc: "Anthropic 대화형 AI", url: "https://claude.ai/", icon: "🟠" },
          { name: "Gemini", desc: "Google 대화형 AI", url: "https://gemini.google.com/", icon: "🔷" },
          { name: "Qwen", desc: "Alibaba 오픈 모델 채팅", url: "https://chat.qwen.ai/", icon: "🟣" },
          { name: "Perplexity", desc: "출처를 함께 보여주는 검색형 AI", url: "https://www.perplexity.ai/", icon: "🔎" }
        ]
      },
      {
        id: "media", label: "이미지 · 영상", icon: "🖼️",
        items: [
          { name: "ChatGPT 이미지", desc: "프롬프트로 이미지 생성·편집", url: "https://chatgpt.com/", icon: "🖌️" },
          { name: "Gemini 이미지", desc: "이미지 생성과 편집", url: "https://gemini.google.com/", icon: "✨" },
          { name: "Grok", desc: "xAI 이미지 생성", url: "https://grok.com/", icon: "⚡" },
          { name: "Google Flow", desc: "AI 영상 제작 도구", url: "https://labs.google/flow/", icon: "🎬" }
        ]
      }
    ]
  },
  {
    id: "info",
    label: "정보 사이트",
    color: "var(--c3)",
    desc: "수업 도입과 읽을거리로 활용하는 정보 사이트입니다.",
    groups: [
      {
        id: "news", label: "뉴스 · 트렌드", icon: "📰",
        items: [
          { name: "AI 뉴스", desc: "최신 인공지능 소식 모아보기", url: "https://ai-new.up.railway.app/", icon: "🤖" },
          { name: "경제 뉴스", desc: "오늘의 경제·비즈니스 이슈", url: "https://biz-news-2607.up.railway.app/", icon: "📈" }
        ]
      },
      {
        id: "media-info", label: "미디어 · 콘텐츠", icon: "🎥",
        items: [
          { name: "YT Insight Hub", desc: "유튜브 인기 영상 분석", url: "https://yt-insight-100m-2608.vercel.app/", icon: "▶️" },
          { name: "게임 허브", desc: "웹으로 즐기는 게임 모음", url: "https://ldjwj.github.io/GameMarket/index.html", icon: "🎮" }
        ]
      }
    ]
  }
];

const topNav = document.getElementById("topNav");
const subNav = document.getElementById("subNav");
const content = document.getElementById("content");
const pageTitle = document.getElementById("pageTitle");
const pageDesc = document.getElementById("pageDesc");

let current = null;

function host(url) {
  try { return new URL(url).hostname.replace(/^www\./, ""); }
  catch { return url; }
}

DATA.forEach(tab => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = tab.label;
  b.setAttribute("role", "tab");
  b.dataset.id = tab.id;
  b.addEventListener("click", () => select(tab.id));
  topNav.appendChild(b);
});

function render(tab) {
  document.documentElement.style.setProperty("--accent", tab.color);

  [...topNav.children].forEach(b =>
    b.setAttribute("aria-selected", b.dataset.id === tab.id));

  pageTitle.textContent = tab.label;
  pageDesc.textContent = tab.desc;

  subNav.innerHTML = "";
  tab.groups.forEach((g, i) => {
    const a = document.createElement("a");
    a.href = "#" + g.id;
    a.textContent = g.label;
    if (i === 0) a.classList.add("active");
    subNav.appendChild(a);
  });

  content.innerHTML = "";
  tab.groups.forEach(g => {
    const sec = document.createElement("section");
    sec.className = "group";
    sec.id = g.id;
    sec.innerHTML = `
      <div class="group-head">
        <h2>${g.icon} ${g.label}</h2>
        <span class="count">${g.items.length}</span>
      </div>
      <div class="grid">
        ${g.items.map(it => `
          <a class="card" href="${it.url}" target="_blank" rel="noopener noreferrer">
            <span class="ico">${it.icon}</span>
            <span class="body">
              <span class="name">${it.name}<span class="ext">↗</span></span>
              <span class="desc">${it.desc}</span>
              <span class="host">${host(it.url)}</span>
            </span>
          </a>`).join("")}
      </div>`;
    content.appendChild(sec);
  });

  observeGroups();
}

// 스크롤 위치에 따라 2단계 메뉴 활성 표시
let observer = null;
function observeGroups() {
  if (observer) observer.disconnect();
  const links = [...subNav.querySelectorAll("a")];
  observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      links.forEach(l => l.classList.toggle("active", l.hash === "#" + e.target.id));
    });
  }, { rootMargin: "-140px 0px -60% 0px", threshold: 0 });
  content.querySelectorAll("section.group").forEach(s => observer.observe(s));
}

function select(id, push = true) {
  const tab = DATA.find(t => t.id === id) || DATA[0];
  if (current === tab.id) return;
  current = tab.id;
  render(tab);
  if (push) history.replaceState(null, "", "#" + tab.id);
  window.scrollTo({ top: 0 });
}

const initial = location.hash.slice(1);
select(DATA.some(t => t.id === initial) ? initial : DATA[0].id, false);
</script>
</body>
</html>
